name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - name: Build
      run: cargo build
    - name: Run tests
      run: cargo test
    - name: Run tests (all features, excluding nexus-net, nexus-web, nexus-async-web)
      run: cargo test --workspace --all-features --exclude nexus-net --exclude nexus-web --exclude nexus-async-web
    - name: Test nexus-net (default - sync)
      run: cargo test -p nexus-net
    - name: Test nexus-net (sync + TLS)
      run: cargo test -p nexus-net --features tls
    - name: Test nexus-web (default)
      run: cargo test -p nexus-web
    - name: Test nexus-web (all features)
      run: cargo test -p nexus-web --all-features
    - name: Test nexus-async-web (tokio-rt + tls, default)
      run: cargo test -p nexus-async-web
    - name: Test nexus-async-web (nexus + tls)
      run: cargo test -p nexus-async-web --no-default-features --features nexus,tls --lib
    - name: Test nexus-async-web (nexus, no tls)
      run: cargo test -p nexus-async-web --no-default-features --features nexus --lib

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - name: Verify MSRV
      run: cargo build --workspace

  test-avx2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - name: Test nexus-inference (AVX2 SIMD path)
      run: |
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-feature=+avx2" \
          cargo test -p nexus-inference --target x86_64-unknown-linux-gnu

  verify-pytorch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install safetensors packaging numpy
    - name: Generate fixtures from PyTorch
      run: python nexus-inference/tests/fixtures/generate_all.py
    - name: Verify Rust matches PyTorch (scalar)
      run: cargo test -p nexus-inference --features safetensors --test safetensors_integration
    - name: Verify Rust matches PyTorch (AVX2)
      run: |
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-feature=+avx2" \
          cargo test -p nexus-inference --features safetensors --test safetensors_integration \
          --target x86_64-unknown-linux-gnu

  verify-lightgbm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: pip install lightgbm==4.6.0 numpy
    - name: Generate fixtures from LightGBM
      run: python nexus-inference/tests/fixtures/generate_lightgbm.py
    - name: Verify fixtures are in sync
      run: git diff --exit-code nexus-inference/tests/fixtures/lgb_*
    - name: Verify Rust matches LightGBM
      run: cargo test -p nexus-inference --features loader-lightgbm --test lightgbm_integration

  verify-fix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: FIX conformance tests (Python peer + Rust engine)
      run: cargo test -p nexus-fix-engine --test fix_conformance

  verify-async-fix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Async FIX conformance tests (Python peer + tokio adapter)
      run: cargo test -p nexus-async-fix-engine --test async_conformance

  verify-fix-harness:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install harness dependencies (behave + quickfix)
      run: pip install -r tools/fix-harness/requirements.txt
    - name: Build harness server
      run: cargo build -p nexus-fix-harness
    - name: Run adversarial FIX harness (behave)
      run: |
        FIX_PORT=9878 cargo run -q -p nexus-fix-harness &
        trap 'kill %1 2>/dev/null || true' EXIT
        for _ in $(seq 1 80); do
          (exec 3<>/dev/tcp/127.0.0.1/9878) 2>/dev/null && { exec 3>&-; break; }
          sleep 0.25
        done
        # Only the adversarial feature is gated: it drives the engine over raw
        # sockets, so it is deterministic and exits cleanly. session.feature uses
        # the quickfix client, which segfaults on interpreter shutdown (exit 139)
        # even when every scenario passes; it stays a local-only smoke test.
        FIX_PORT=9878 behave tools/fix-harness/features/adversarial.feature

  loom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.94.0
    - name: Loom model checks (all loom_* tests)
      run: ./tools/loom.sh

  miri:
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-ignore-leaks
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    - name: miri (nexus-slab)
      run: cargo miri test -p nexus-slab --test miri_tests
    - name: miri (nexus-smartptr)
      run: cargo miri test -p nexus-smartptr --test miri_tests
    - name: miri (nexus-collections)
      run: cargo miri test -p nexus-collections --test miri_tests --features slab
